name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below; it makes triage much faster.

        For **security issues**, do NOT open an issue. See [SECURITY.md](https://github.com/ajianaz/tole-gateway/blob/develop/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: tole-gateway version
      description: Run `tole-gateway --version` or name the commit you built.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: tole-version
    attributes:
      label: tole version
      description: Run `tole --version` on the server the gateway talks to.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list of exact steps. Never paste tokens, pairing codes or chat ids.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant output. Remove secrets and personal identifiers first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I removed secrets and personal identifiers from everything above
          required: true
