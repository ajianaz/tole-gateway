name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! A short conversation here saves everyone time before any code is written.

        The gateway is intentionally thin: business logic belongs in `tole serve`, not here. A "no" is not a judgment of the idea.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The **why**, not the **what**. What were you trying to do when you wished this existed?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you imagine using this? A command, a config key, a chat interaction.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried?

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to contribute the implementation?
      options:
        - "Yes, with guidance"
        - "Yes, I can do it"
        - "No, just suggesting"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
